version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: timesheet-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - timesheet-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - timesheet-network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-timesheet}
      POSTGRES_USER: ${DB_USERNAME:-timesheet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - timesheet-network

networks:
  timesheet-network:
    driver: bridge

volumes:
  dbdata:
